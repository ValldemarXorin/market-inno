server:
  servlet:
    context-path: /api/v1

spring:
  application:
    name: user-service
  profiles:
    active: local # По умолчанию запускаемся локально из IDE

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  cache:
    type: redis

logging:
  level:
    org.hibernate.SQL: DEBUG