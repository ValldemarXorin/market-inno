plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

ext {
	mapstructVersion = "1.6.3"
}

group = 'inno'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(23)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.liquibase:liquibase-core'

	// PostgreSQL driver
	runtimeOnly 'org.postgresql:postgresql'

	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

	// Модуль для поддержки десериализации Record (без пустых конструкторов)
	implementation 'com.fasterxml.jackson.module:jackson-module-parameter-names'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	//mapstruct
	implementation "org.mapstruct:mapstruct:${mapstructVersion}"
	annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	implementation 'org.springframework.boot:spring-boot-starter-aop'

	implementation 'org.springframework.kafka:spring-kafka'

	// Circuit breaker for synchronous Order -> User communication
	implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.3.0'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	testImplementation 'org.testcontainers:junit-jupiter:1.20.1'
	testImplementation 'org.testcontainers:postgresql:1.20.1'
	testImplementation 'org.springframework.kafka:spring-kafka-test'

	// WireMock for mocking User Service HTTP communication in integration tests
	testImplementation 'org.wiremock:wiremock-standalone:3.13.2'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test

	reports {
		xml.required = true
		html.required = true
	}

	classDirectories.setFrom(files(classDirectories.files.collect {
		fileTree(dir: it, exclude: [
				'**/*MapperImpl*.*',
				'inno/**/exception/**',
				'inno/**/dao/**',
				'inno/**/*Application.*'
		])
	}))
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs.add("-Amapstruct.defaultComponentModel=spring") // Опционально для удобства MapStruct
}

