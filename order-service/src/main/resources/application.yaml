server:
  servlet:
    context-path: /api/v1

spring:
  application:
    name: order-service
  profiles:
    active: local

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest

app:
  user-service:
    base-url: ${USER_SERVICE_BASE_URL:http://localhost:8080/api/v1}

logging:
  level:
    org.hibernate.SQL: DEBUG
