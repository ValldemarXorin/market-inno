name: CI User Service

on:
  push:
    branches:
      - develop
      - main
      - feature/**
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-test-sonar-docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 23
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build project
        run: ./gradlew clean build --no-daemon

      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=ValldemarXorin_market-inno
            -Dsonar.organization=valldemarxorin
            -Dsonar.java.binaries=user-service/build/classes
            -Dsonar.java.libraries=user-service/build/libs/*.jar
            -Dsonar.java.test.binaries=user-service/build/classes/java/test
            -Dsonar.junit.reportPaths=user-service/build/test-results/test

      - name: Build Docker image
        run: |
          docker build \
            -t market-inno-user-service:${{ github.sha }} \
            ./user-service